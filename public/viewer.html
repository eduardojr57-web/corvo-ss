<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Assistir • Corvo SS</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="brand">🐦‍⬛ Corvo SS</div>
      <div style="font-size:0.9rem;color:var(--text-muted);">Convidado (somente visualização)</div>

    <div id="announcementArea"></div>

    <div class="panel">

      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
