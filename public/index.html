<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Corvo SS</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐦‍⬛</text></svg>">
</head>
<body>
  <div class="container">
    <header class="hero">
      <div class="logo">🐦‍⬛</div>
      <h1>Corvo SS</h1>
      <p class="tagline">Compartilhamento de tela seguro com convites</p>
    </header>

    <div class="card">
      <h2>Entrar em uma sessão</h2>
      <div class="form-group">
        <label for="code">Código do convite</label>
        <input type="text" id="code" placeholder="Ex: A3K9P2" maxlength="8" autocomplete="off" style="text-transform: uppercase;" />
      </div>
      <div class="form-group">
        <label for="name">Seu nome (opcional)</label>
        <input type="text" id="name" placeholder="Como deseja ser chamado" maxlength="30" />
      </div>
      <div class="btn-group">
        <button class="btn btn-primary" onclick="joinAs('sharer')">Transmitir tela</button>
        <button class="btn btn-secondary" onclick="joinAs('viewer')">Só assistir</button>
      </div>
    </div>

    <div class="card admin-card">
      <h2>Administrador</h2>
      <p>Crie uma nova sessão e compartilhe o código com os participantes.</p>
      <div class="form-group">
        <label for="adminPass">Senha do administrador</label>
        <input type="password" id="adminPass" placeholder="Digite a senha" maxlength="40" />
      </div>
      <button class="btn btn-accent" onclick="createRoom()">Criar sessão</button>
    </div>

    <footer>
      <p>Protótipo • Até 4 transmissores • Gravação local no navegador</p>
    </footer>
  </div>

  <script>
    const codeInput = document.getElementById('code');
    const nameInput = document.getElementById('name');

    function joinAs(role) {
      const code = codeInput.value.trim().toUpperCase();
      if (!code || code.length < 4) {
        alert('Digite um código válido.');
        return;
      }
      const name = nameInput.value.trim() || '';
      const params = new URLSearchParams({ code, name });
      if (role === 'sharer') {
        window.location.href = `/transmitter.html?${params}`;
      } else {
        window.location.href = `/viewer.html?${params}`;
      }
    }

    async function createRoom() {
      const password = document.getElementById('adminPass').value;
      if (!password) {
        alert('Digite a senha do administrador.');
        return;
      }
      try {
        const res = await fetch('/api/create-room', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        const data = await res.json();
        if (!res.ok) {
          alert(data.error || 'Senha incorreta.');
          return;
        }
        if (data.code) {
          const name = nameInput.value.trim() || 'Admin';
          window.location.href = `/admin.html?code=${data.code}&name=${encodeURIComponent(name)}&token=${data.token}`;
        }
      } catch (e) {
        alert('Erro ao criar sessão. Tente novamente.');
      }
    }

    codeInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') joinAs('sharer');
    });
  </script>
</body>
</html>
